<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MetaTraffic LPR</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">MetaTraffic LPR</div>
    <div class="auth-title">Set New Password</div>
    <div class="auth-sub" id="sub-text">Loading…</div>

    <div class="alert" id="alert"></div>

    <div id="form-wrap" style="display:none">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="pw1" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="pw2" autocomplete="new-password">
      </div>
      <p style="font-size:11px;color:var(--muted);margin-bottom:14px;">Min 8 characters — must include uppercase, lowercase, and a number.</p>
      <button class="btn-primary" id="btn-reset" onclick="submit()">Set Password</button>
    </div>

    <div class="auth-link"><a href="/login">Back to login</a></div>
  </div>

  <script>
    const alertEl = document.getElementById('alert');
    const token   = new URLSearchParams(location.search).get('token');

    async function init() {
      if (!token) return showError('Missing reset token.');
      const res  = await fetch(`/api/auth/validate-reset-token/${token}`);
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Invalid or expired reset link.');
      document.getElementById('sub-text').textContent = `Setting new password for ${data.email}`;
      document.getElementById('form-wrap').style.display = '';
    }

    async function submit() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      alertEl.className = 'alert';
      if (!pw1) return showError('Enter a new password.');
      if (pw1 !== pw2) return showError('Passwords do not match.');

      const btn = document.getElementById('btn-reset');
      btn.disabled = true; btn.textContent = 'Saving…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, password: pw1 }),
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error);
        alertEl.textContent = 'Password updated! Redirecting to login…';
        alertEl.className   = 'alert success';
        document.getElementById('form-wrap').style.display = 'none';
        setTimeout(() => location.href = '/login', 1500);
      } catch {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Set Password';
      }
    }

    function showError(msg) { alertEl.textContent = msg; alertEl.className = 'alert error'; }
    init();
  </script>
</body>
</html>
