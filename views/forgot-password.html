<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — MetaTraffic LPR</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">MetaTraffic LPR</div>
    <div class="auth-title">Reset Password</div>
    <div class="auth-sub">Enter your email and we'll send you a reset link.</div>

    <div class="alert" id="alert"></div>

    <div id="form-wrap">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" autofocus>
      </div>
      <button class="btn-primary" id="btn-send" onclick="submit()">Send Reset Link</button>
    </div>

    <div class="auth-link"><a href="/login">Back to login</a></div>
  </div>

  <script>
    const alertEl = document.getElementById('alert');

    document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    async function submit() {
      const email = document.getElementById('email').value.trim();
      if (!email) { alertEl.textContent = 'Enter your email'; alertEl.className = 'alert error'; return; }

      const btn = document.getElementById('btn-send');
      btn.disabled = true; btn.textContent = 'Sending…';
      alertEl.className = 'alert';

      try {
        await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }),
        });
        alertEl.textContent = 'If that email is registered, a reset link has been sent.';
        alertEl.className   = 'alert success';
        document.getElementById('form-wrap').style.display = 'none';
      } catch {
        alertEl.textContent = 'Network error. Please try again.';
        alertEl.className   = 'alert error';
      } finally {
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
